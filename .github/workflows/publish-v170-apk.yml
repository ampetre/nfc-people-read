name: Publish RoB NFC tag reader v1.7 APK

on:
  push:
    paths:
      - '.github/workflows/publish-v170-apk.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4

      - name: Download and verify APK
        env:
          APK_ZIP_URL: 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-6f6c-8246-af54-d3a2b480ee55/raw?se=2026-07-28T04:39:32Z&sp=r&sv=2026-02-06&sr=b&scid=aff39386-57f7-5f8f-b1df-4112ad39fab7&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-27T21:21:44Z&ske=2026-07-29T21:21:44Z&sks=b&skv=2026-02-06&sig=RZMv6McL0YEQVTxl8lDLklhUjQjWLbxTXwTAE17UShc%3D'
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 "$APK_ZIP_URL" -o apk-artifact.zip
          unzip -q apk-artifact.zip -d apk-artifact
          APK_PATH="$(find apk-artifact -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          echo '9a2c0b0f59120905293841ae41b77de30c4d1688ae5ca73c809e229969f4de59  '"$APK_PATH" | sha256sum -c -
          unzip -t "$APK_PATH"
          mkdir -p download
          cp "$APK_PATH" download/RoB-NFC-tag-reader-v1.7.0.apk
          cp "$APK_PATH" download/RoB-NFC-tag-reader-latest.apk
          cp "$APK_PATH" download/NFC-People-Logger-latest.apk

      - name: Publish APK files
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add download/RoB-NFC-tag-reader-v1.7.0.apk download/RoB-NFC-tag-reader-latest.apk download/NFC-People-Logger-latest.apk
          git commit -m 'Publish RoB NFC tag reader v1.7.0 APK'
          git push
