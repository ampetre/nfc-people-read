name: Publish RoB v2.0.3

on:
  push:
    paths:
      - .github/workflows/publish-rob-v203.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v2.0.3 artifact
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-b12c-81f4-96d4-60d08fa0625a/raw?se=2026-10-02T00%3A27%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=4a86ab44-2f35-5bf6-9de0-1e5a87bd77c1&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T20%3A48%3A47Z&ske=2026-10-02T20%3A48%3A47Z&sks=b&skv=2026-02-06&sig=KWfn4AWqO50CMGlUoe9pEqz/njehww4LXEt21vFp1tE%3D' -o /tmp/rob-v203.zip
          mkdir -p /tmp/rob-v203
          unzip -q /tmp/rob-v203.zip -d /tmp/rob-v203
          echo '5c8aeafa2eff386ab678fe4be826a2919483eb61d3822fce000cc567eb7496fb  /tmp/rob-v203/RoB-NFC-tag-reader-v2.0.3.apk' | sha256sum -c -
          echo '2fa99d24dde7943b6cbed7b41290f0dd086ba8bb60d2fcb2d3e867cb2b7b6d2e  /tmp/rob-v203/RoB-NFC-tag-reader-v2.0.3-source.zip' | sha256sum -c -

      - name: Publish stable and versioned downloads
        run: |
          set -euxo pipefail
          mkdir -p download source
          cp /tmp/rob-v203/RoB-NFC-tag-reader-v2.0.3.apk download/RoB-NFC-tag-reader-v2.0.3.apk
          cp /tmp/rob-v203/RoB-NFC-tag-reader-v2.0.3.apk download/RoB-NFC-tag-reader-latest.apk
          cp /tmp/rob-v203/RoB-NFC-tag-reader-v2.0.3.apk download/NFC-People-Logger-latest.apk
          cp /tmp/rob-v203/RoB-NFC-tag-reader-v2.0.3-source.zip source/RoB-NFC-tag-reader-v2.0.3-source.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download source
          git commit -m "Publish RoB NFC tag reader v2.0.3"
          git push
