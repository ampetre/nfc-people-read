name: Publish RoB v1.9.0

on:
  push:
    paths:
      - '.github/workflows/publish-rob-v190.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download validated v1.9.0 build artifact
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-44e8-8210-a6a4-818c7a051f3e/raw?se=2026-10-01T14%3A18%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=67413d7f-4a40-550e-8469-c3c14b4eaaca&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T08%3A29%3A31Z&ske=2026-10-02T08%3A29%3A31Z&sks=b&skv=2026-02-06&sig=LgZbCsmUt5g1WtrLJkZjgj0iBr0hQDhiNCV8ecMiO3A%3D' -o dual.zip
          mkdir artifact
          unzip -q dual.zip -d artifact
          test -s artifact/RoB-NFC-tag-reader-v1.9.0.apk
          echo 'bb1913098742c1b887bb6d8f04e83db8cef2c4725889a54e7a39831867b91e03  artifact/RoB-NFC-tag-reader-v1.9.0.apk' | sha256sum -c -
          unzip -t artifact/RoB-NFC-tag-reader-v1.9.0.apk
      - name: Publish RoB APK aliases
        run: |
          set -euxo pipefail
          mkdir -p download
          cp artifact/RoB-NFC-tag-reader-v1.9.0.apk download/RoB-NFC-tag-reader-v1.9.0.apk
          cp artifact/RoB-NFC-tag-reader-v1.9.0.apk download/RoB-NFC-tag-reader-latest.apk
          cp artifact/RoB-NFC-tag-reader-v1.9.0.apk download/NFC-People-Logger-latest.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add download/RoB-NFC-tag-reader-v1.9.0.apk download/RoB-NFC-tag-reader-latest.apk download/NFC-People-Logger-latest.apk
          git commit -m 'Publish RoB NFC tag reader v1.9.0'
          git push
