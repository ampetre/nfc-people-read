name: Audit RoB v2.0.6 deletion fix

on:
  push:
    paths:
      - .github/workflows/audit-rob-v206.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack published v2.0.6 source
        run: |
          set -euxo pipefail
          rm -rf /tmp/rob-src
          mkdir -p /tmp/rob-src
          unzip -q source/RoB-NFC-tag-reader-v2.0.6-source.zip -d /tmp/rob-src
          test -f /tmp/rob-src/app/src/main/java/com/andrei/nfcpeople/AppDatabase.java
          grep -n 'sequence_number ASC, id ASC' /tmp/rob-src/app/src/main/java/com/andrei/nfcpeople/AppDatabase.java
          grep -n 'values.put("sequence_number"' /tmp/rob-src/app/src/main/java/com/andrei/nfcpeople/AppDatabase.java

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Generate temporary audit keystore
        run: |
          set -euxo pipefail
          keytool -genkeypair -noprompt             -keystore /tmp/rob-src/app/nfc-people-test.jks             -storepass nfcpeople-test-2026             -keypass nfcpeople-test-2026             -alias nfcpeople             -keyalg RSA             -keysize 2048             -validity 3650             -dname "CN=RoB Build Audit,O=Audit,C=RO"

      - name: Compile and package published source
        run: |
          set -euxo pipefail
          cd /tmp/rob-src
          gradle --no-daemon clean assembleDebug assembleRelease --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
