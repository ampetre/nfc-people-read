name: Audit RoB v2.0.6 deletion fix

on:
  push:
    paths:
      - .github/workflows/audit-rob-v206.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect published v2.0.6 source
        run: |
          set -euxo pipefail
          rm -rf /tmp/rob-src
          mkdir -p /tmp/rob-src
          unzip -q source/RoB-NFC-tag-reader-v2.0.6-source.zip -d /tmp/rob-src
          echo '=== AppDatabase deleteScan ==='
          sed -n '120,190p' /tmp/rob-src/app/src/main/java/com/andrei/nfcpeople/AppDatabase.java
          echo '=== MainActivity delete confirmation ==='
          sed -n '600,645p' /tmp/rob-src/app/src/main/java/com/andrei/nfcpeople/MainActivity.java
          echo '=== root build.gradle.kts ==='
          cat /tmp/rob-src/build.gradle.kts
          echo '=== settings.gradle.kts ==='
          cat /tmp/rob-src/settings.gradle.kts
          echo '=== app/build.gradle.kts ==='
          cat /tmp/rob-src/app/build.gradle.kts
          echo '=== source tree ==='
          find /tmp/rob-src -maxdepth 4 -type f | sort | head -200
