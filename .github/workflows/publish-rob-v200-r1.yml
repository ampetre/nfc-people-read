name: Publish regenerated RoB v2.0.0

on:
  push:
    paths:
      - .github/workflows/publish-rob-v200-r1.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified regenerated v2.0.0
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-56b4-81f4-a96c-a1930492e8ea/raw?se=2026-10-01T15%3A14%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=9df14692-8c80-51cc-93ed-b937d84e5939&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T11%3A54%3A16Z&ske=2026-10-02T11%3A54%3A16Z&sks=b&skv=2026-02-06&sig=Guk0p9d2oS4wt9NnW1IVwdFOW521HJPg54KhAdHgtMU%3D' -o /tmp/rob-v200-r1.zip
          mkdir -p /tmp/rob-v200-r1
          unzip -q /tmp/rob-v200-r1.zip -d /tmp/rob-v200-r1
          echo '7379b9ff279c16809a30105984e911851c19435945693b910a43b290d64b7987  /tmp/rob-v200-r1/RoB-NFC-tag-reader-v2.0.0.apk' | sha256sum -c -
          echo '8fbe7d34e4f677424ba291147a53f2edcde0d7d86119d17833840ff260eccb7e  /tmp/rob-v200-r1/RoB-NFC-tag-reader-v2.0.0-source.zip' | sha256sum -c -

      - name: Replace stable and v2.0.0 downloads
        run: |
          set -euxo pipefail
          mkdir -p download source
          cp /tmp/rob-v200-r1/RoB-NFC-tag-reader-v2.0.0.apk download/RoB-NFC-tag-reader-v2.0.0.apk
          cp /tmp/rob-v200-r1/RoB-NFC-tag-reader-v2.0.0.apk download/RoB-NFC-tag-reader-latest.apk
          cp /tmp/rob-v200-r1/RoB-NFC-tag-reader-v2.0.0.apk download/NFC-People-Logger-latest.apk
          cp /tmp/rob-v200-r1/RoB-NFC-tag-reader-v2.0.0-source.zip source/RoB-NFC-tag-reader-v2.0.0-source.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download source
          git commit -m "Regenerate RoB NFC tag reader v2.0.0"
          git push
