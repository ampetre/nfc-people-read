name: Republish corrected RoB v2.0.5

on:
  push:
    paths:
      - .github/workflows/publish-rob-v205-corrected.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download validated corrected v2.0.5
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 'https://sdmntprukwest.oaiusercontent.com/files/00000000-dbcc-8243-9fa1-ab5c60fb5164/raw?se=2026-10-02T07%3A14%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=e98e3025-d7d8-51a7-822c-75290dddd21c&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T04%3A56%3A01Z&ske=2026-10-03T04%3A56%3A01Z&sks=b&skv=2026-02-06&sig=DJjHGiJBwDoM4Q/lSidFH02bd6veYBR%2BerKMP7fOxro%3D' -o /tmp/rob-v205-corrected.zip
          mkdir -p /tmp/rob-v205
          unzip -q /tmp/rob-v205-corrected.zip -d /tmp/rob-v205
          echo '1786c3ae855421708151d5575bdd5ca52737f7b7c8ae08853b46393b2a98df00  /tmp/rob-v205/RoB-NFC-tag-reader-v2.0.5.apk' | sha256sum -c -
          echo '5f6f3f58e52276b343a56fc44b8d8366c48689d7e7cd23805cca7c3652a2299d  /tmp/rob-v205/RoB-NFC-tag-reader-v2.0.5-source.zip' | sha256sum -c -

      - name: Replace stable and v2.0.5 downloads
        run: |
          set -euxo pipefail
          mkdir -p download source
          cp /tmp/rob-v205/RoB-NFC-tag-reader-v2.0.5.apk download/RoB-NFC-tag-reader-v2.0.5.apk
          cp /tmp/rob-v205/RoB-NFC-tag-reader-v2.0.5.apk download/RoB-NFC-tag-reader-latest.apk
          cp /tmp/rob-v205/RoB-NFC-tag-reader-v2.0.5.apk download/NFC-People-Logger-latest.apk
          cp /tmp/rob-v205/RoB-NFC-tag-reader-v2.0.5-source.zip source/RoB-NFC-tag-reader-v2.0.5-source.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download source
          git commit -m "Republish corrected RoB NFC tag reader v2.0.5"
          git push
