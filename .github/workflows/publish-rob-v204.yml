name: Publish RoB v2.0.4

on:
  push:
    paths:
      - .github/workflows/publish-rob-v204.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v2.0.4 artifact
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-3674-8210-9394-26cd814453bd/raw?se=2026-10-02T05%3A10%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=868ef85f-4f9b-5ecd-b9be-cd961d7477ec&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T04%3A38%3A53Z&ske=2026-10-03T04%3A38%3A53Z&sks=b&skv=2026-02-06&sig=kC1%2ByFxizX4AVfXgo7Chh6XXsM0yx2wrBtvGrnSh1yU%3D' -o /tmp/rob-v204.zip
          mkdir -p /tmp/rob-v204
          unzip -q /tmp/rob-v204.zip -d /tmp/rob-v204
          echo 'd2aa95d7ee2ad876bf90c6a3114ad3fb74a152a0caa7b718c62c4166f338ddef  /tmp/rob-v204/RoB-NFC-tag-reader-v2.0.4.apk' | sha256sum -c -
          echo '5e81d11f2867e03ac435e79f6d10cfc9d152e7883efc1d5a22223112262c1a1a  /tmp/rob-v204/RoB-NFC-tag-reader-v2.0.4-source.zip' | sha256sum -c -

      - name: Publish stable and versioned downloads
        run: |
          set -euxo pipefail
          mkdir -p download source
          cp /tmp/rob-v204/RoB-NFC-tag-reader-v2.0.4.apk download/RoB-NFC-tag-reader-v2.0.4.apk
          cp /tmp/rob-v204/RoB-NFC-tag-reader-v2.0.4.apk download/RoB-NFC-tag-reader-latest.apk
          cp /tmp/rob-v204/RoB-NFC-tag-reader-v2.0.4.apk download/NFC-People-Logger-latest.apk
          cp /tmp/rob-v204/RoB-NFC-tag-reader-v2.0.4-source.zip source/RoB-NFC-tag-reader-v2.0.4-source.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download source
          git commit -m "Publish RoB NFC tag reader v2.0.4"
          git push
