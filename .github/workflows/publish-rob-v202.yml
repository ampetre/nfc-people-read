name: Publish RoB v2.0.2

on:
  push:
    paths:
      - .github/workflows/publish-rob-v202.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v2.0.2 artifact
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-2738-8210-97f8-fedf84337459/raw?se=2026-10-01T23%3A55%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=e5350db5-8512-5706-b1bd-945aa7380721&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T20%3A58%3A37Z&ske=2026-10-02T20%3A58%3A37Z&sks=b&skv=2026-02-06&sig=1CBpxUleLaotl1yMiWK51MJ4CQMFHLdxW1t09fjjC8w%3D' -o /tmp/rob-v202.zip
          mkdir -p /tmp/rob-v202
          unzip -q /tmp/rob-v202.zip -d /tmp/rob-v202
          echo '83aef519b6f4efd20c58c806a8445cf09a4ff08cd7de4a640e6c129ef05b1c91  /tmp/rob-v202/RoB-NFC-tag-reader-v2.0.2.apk' | sha256sum -c -
          echo '100e0e8d0ebc9fc0264dd8eed168c4b2e0c18625c1a96da0f36eca3409d9b330  /tmp/rob-v202/RoB-NFC-tag-reader-v2.0.2-source.zip' | sha256sum -c -

      - name: Publish stable and versioned downloads
        run: |
          set -euxo pipefail
          mkdir -p download source
          cp /tmp/rob-v202/RoB-NFC-tag-reader-v2.0.2.apk download/RoB-NFC-tag-reader-v2.0.2.apk
          cp /tmp/rob-v202/RoB-NFC-tag-reader-v2.0.2.apk download/RoB-NFC-tag-reader-latest.apk
          cp /tmp/rob-v202/RoB-NFC-tag-reader-v2.0.2.apk download/NFC-People-Logger-latest.apk
          cp /tmp/rob-v202/RoB-NFC-tag-reader-v2.0.2-source.zip source/RoB-NFC-tag-reader-v2.0.2-source.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download source
          git commit -m "Publish RoB NFC tag reader v2.0.2"
          git push
