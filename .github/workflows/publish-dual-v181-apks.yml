name: Publish dual NFC v1.8.1 APKs

on:
  push:
    paths:
      - '.github/workflows/publish-dual-v181-apks.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4

      - name: Download and verify release package
        env:
          RELEASE_ZIP_URL: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-1bac-820a-9591-57625a90151e/raw?se=2026-07-30T03:59:46Z&sp=r&sv=2026-02-06&sr=b&scid=d18b0673-35f4-5085-9a66-424ea710ebe8&skoid=061609b8-1cdb-4a5b-9e68-c7ab9a523a8f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-29T23:31:38Z&ske=2026-07-31T23:31:38Z&sks=b&skv=2026-02-06&sig=Yar%2By%2BB5FLL90OQ94vO2Vmhf/U4JuWgCf8yh6E4tyBw%3D'
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 "$RELEASE_ZIP_URL" -o release-package.zip
          unzip -q release-package.zip -d release-package
          ROB="$(find release-package -type f -name 'RoB-NFC-tag-reader-v1.8.1.apk' -print -quit)"
          GENERIC="$(find release-package -type f -name 'NFC-to-Excel-tag-reader-v1.8.1.apk' -print -quit)"
          test -s "$ROB"
          test -s "$GENERIC"
          echo '5f22dd0d991381a21db9943b8840c9857b258498bbbd09fb4909217f2af60986  '"$ROB" | sha256sum -c -
          echo '3dd485b6d26d844563e1b83111443227ed4a40a99bf4bbe35b3c09c5579c8c33  '"$GENERIC" | sha256sum -c -
          unzip -t "$ROB"
          unzip -t "$GENERIC"
          mkdir -p download
          cp "$ROB" download/RoB-NFC-tag-reader-v1.8.1.apk
          cp "$ROB" download/RoB-NFC-tag-reader-latest.apk
          cp "$ROB" download/NFC-People-Logger-latest.apk
          cp "$GENERIC" download/NFC-to-Excel-tag-reader-v1.8.1.apk
          cp "$GENERIC" download/NFC-to-Excel-tag-reader-latest.apk

      - name: Publish APK files
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            download/RoB-NFC-tag-reader-v1.8.1.apk \
            download/RoB-NFC-tag-reader-latest.apk \
            download/NFC-People-Logger-latest.apk \
            download/NFC-to-Excel-tag-reader-v1.8.1.apk \
            download/NFC-to-Excel-tag-reader-latest.apk
          git commit -m 'Publish both NFC v1.8.1 APK variants'
          git push
