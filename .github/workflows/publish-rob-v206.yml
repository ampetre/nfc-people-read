name: Publish RoB v2.0.6

on:
  push:
    paths:
      - .github/workflows/publish-rob-v206.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v2.0.6 artifact
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-23e0-81f4-8b43-365cc170375e/raw?se=2026-10-02T07%3A28%3A12Z&sp=r&sv=2026-02-06&sr=b&scid=9b91a80c-ea21-5000-870b-495c3cfdb19a&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T06%3A19%3A02Z&ske=2026-10-03T06%3A19%3A02Z&sks=b&skv=2026-02-06&sig=98jSc7OUqoYHS7hQthBKa/xrBMUB18U8lIfrd9Ukprs%3D' -o /tmp/rob-v206.zip
          mkdir -p /tmp/rob-v206
          unzip -q /tmp/rob-v206.zip -d /tmp/rob-v206
          echo 'ec9c692dd799aff928a00d5526bdef330985734831afcbdb63fb4fcf6d0c82a6  /tmp/rob-v206/RoB-NFC-tag-reader-v2.0.6.apk' | sha256sum -c -
          echo 'a4b4ac5e8d05123453f8704fcb86d4518ce19d73db91e6b5c354395e66139129  /tmp/rob-v206/RoB-NFC-tag-reader-v2.0.6-source.zip' | sha256sum -c -

      - name: Publish stable and versioned downloads
        run: |
          set -euxo pipefail
          mkdir -p download source
          cp /tmp/rob-v206/RoB-NFC-tag-reader-v2.0.6.apk download/RoB-NFC-tag-reader-v2.0.6.apk
          cp /tmp/rob-v206/RoB-NFC-tag-reader-v2.0.6.apk download/RoB-NFC-tag-reader-latest.apk
          cp /tmp/rob-v206/RoB-NFC-tag-reader-v2.0.6.apk download/NFC-People-Logger-latest.apk
          cp /tmp/rob-v206/RoB-NFC-tag-reader-v2.0.6-source.zip source/RoB-NFC-tag-reader-v2.0.6-source.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download source
          git commit -m "Publish RoB NFC tag reader v2.0.6"
          git push
