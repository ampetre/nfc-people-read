name: Publish NFC People Logger v1.6 APK

on:
  push:
    paths:
      - '.github/workflows/publish-v160-apk.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4

      - name: Download and verify APK
        env:
          APK_ZIP_URL: 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-1940-8246-a3d6-3ff7db6dc0ce/raw?se=2026-07-27T16:17:27Z&sp=r&sv=2026-02-06&sr=b&scid=b623e10d-8bef-591d-828a-dee063bfd989&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-27T04:42:48Z&ske=2026-07-29T04:42:48Z&sks=b&skv=2026-02-06&sig=Ycj5QkgcBPvMYk620gujNb6tUwG7Gf08JntsckhWeNQ%3D'
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 "$APK_ZIP_URL" -o apk-artifact.zip
          unzip -q apk-artifact.zip -d apk-artifact
          APK_PATH="$(find apk-artifact -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          echo '93348f3bb5a93fafeddc0bef4da15d1f2fc208f04ccd52c19d693e77d42ae604  '"$APK_PATH" | sha256sum -c -
          unzip -t "$APK_PATH"
          mkdir -p download
          cp "$APK_PATH" download/NFC-People-Logger-v1.6.0.apk
          cp "$APK_PATH" download/NFC-People-Logger-latest.apk

      - name: Publish APK files
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add download/NFC-People-Logger-v1.6.0.apk download/NFC-People-Logger-latest.apk
          git commit -m 'Publish NFC People Logger v1.6.0 APK'
          git push
