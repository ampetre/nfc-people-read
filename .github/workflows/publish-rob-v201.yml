name: Publish RoB v2.0.1

on:
  push:
    paths:
      - .github/workflows/publish-rob-v201.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v2.0.1 artifact
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-8cd4-8210-b973-f95761f22e62/raw?se=2026-10-01T23%3A40%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=0976bf43-0021-5f55-8a68-2b01601569ca&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T20%3A43%3A44Z&ske=2026-10-02T20%3A43%3A44Z&sks=b&skv=2026-02-06&sig=d3jmvWz42nATg2WUS%2BqDeDIIHsbY0gHND0nDATT9lvM%3D' -o /tmp/rob-v201.zip
          mkdir -p /tmp/rob-v201
          unzip -q /tmp/rob-v201.zip -d /tmp/rob-v201
          echo '1101186ca87e7cb9018bc83872fb1e9f5d97b655907d0862992e3bdf1ebe214c  /tmp/rob-v201/RoB-NFC-tag-reader-v2.0.1.apk' | sha256sum -c -
          echo 'd79be741551b1d085bb9400a3700362f23da3b653d0548715603526bd763ad18  /tmp/rob-v201/RoB-NFC-tag-reader-v2.0.1-source.zip' | sha256sum -c -

      - name: Publish stable and versioned downloads
        run: |
          set -euxo pipefail
          mkdir -p download source
          cp /tmp/rob-v201/RoB-NFC-tag-reader-v2.0.1.apk download/RoB-NFC-tag-reader-v2.0.1.apk
          cp /tmp/rob-v201/RoB-NFC-tag-reader-v2.0.1.apk download/RoB-NFC-tag-reader-latest.apk
          cp /tmp/rob-v201/RoB-NFC-tag-reader-v2.0.1.apk download/NFC-People-Logger-latest.apk
          cp /tmp/rob-v201/RoB-NFC-tag-reader-v2.0.1-source.zip source/RoB-NFC-tag-reader-v2.0.1-source.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download source
          git commit -m "Publish RoB NFC tag reader v2.0.1"
          git push
