name: Publish RoB NFC tag reader v1.8 APK

on:
  push:
    paths:
      - '.github/workflows/publish-v180-apk.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4

      - name: Download and verify APK
        env:
          APK_ZIP_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-0ce4-81f4-bbcc-18b3b09398ab/raw?se=2026-07-29T20:04:46Z&sp=r&sv=2026-02-06&sr=b&scid=ffe786c3-2e5f-55f9-bf3b-448c8a86436b&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-29T04:07:13Z&ske=2026-07-31T04:07:13Z&sks=b&skv=2026-02-06&sig=CPu5eyu5nxEGc1qNMDwuFvZYQ2GNSVHKJ7cdDrol2lM%3D'
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 "$APK_ZIP_URL" -o apk-artifact.zip
          unzip -q apk-artifact.zip -d apk-artifact
          APK_PATH="$(find apk-artifact -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          echo '63e71882313993e6a7fd1081c80c5004aaeb2134c3d46297c6da7b1c551ee6f3  '"$APK_PATH" | sha256sum -c -
          unzip -t "$APK_PATH"
          mkdir -p download
          cp "$APK_PATH" download/RoB-NFC-tag-reader-v1.8.0.apk
          cp "$APK_PATH" download/RoB-NFC-tag-reader-latest.apk
          cp "$APK_PATH" download/NFC-People-Logger-latest.apk

      - name: Publish APK files
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add download/RoB-NFC-tag-reader-v1.8.0.apk download/RoB-NFC-tag-reader-latest.apk download/NFC-People-Logger-latest.apk
          git commit -m 'Publish RoB NFC tag reader v1.8.0 APK'
          git push
