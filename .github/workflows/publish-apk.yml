name: Publish NFC People Logger APK

on:
  push:
    paths:
      - '.github/workflows/publish-apk.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4

      - name: Download and verify APK
        env:
          APK_ZIP_URL: 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-7590-8246-af78-1d6da2b20547/raw?se=2026-07-27T07:06:52Z&sp=r&sv=2026-02-06&sr=b&scid=b4d0c7ac-73b8-5e92-b3fe-46c76e3763e1&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-27T04:18:04Z&ske=2026-07-29T04:18:04Z&sks=b&skv=2026-02-06&sig=8%2BDGv8M3rzYeEH0H4bRVWS4uE7EtB65//A08iIoGmLU%3D'
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$APK_ZIP_URL" -o apk-artifact.zip
          unzip -q apk-artifact.zip -d apk-artifact
          APK_PATH="$(find apk-artifact -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          echo '4e5221161fa94187a8a37168926866ecfda6991b1d4e538deeca6b2f54c33148  '"$APK_PATH" | sha256sum -c -
          unzip -t "$APK_PATH"
          mkdir -p download
          cp "$APK_PATH" download/NFC-People-Logger-v1.5.0.apk

      - name: Publish APK in repository
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add download/NFC-People-Logger-v1.5.0.apk
          git commit -m 'Publish NFC People Logger v1.5.0 APK'
          git push
